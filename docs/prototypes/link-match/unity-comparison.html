<p>此页保留首版三关的 Unity 历史截图。左侧嵌入的是当前五关原型，入口关卡数量等内容已变化，不能据此宣称当前 UI 一致。查看 <a href="../link-match-density/unity.html">48 / 96 / 192 张最新 Unity 密度对照</a>；历史原始截图未修饰。</p>

<script>
const cases={entry:['entry&profile=new&level=1','entry-new-388x784',388,784,'新玩家状态不创建活动局；成绩与完成进度来自真实记录。'],board:['relaxed&profile=resume&level=3&size=compact','prototype-fixture-48-360x640',360,640,'相同固定排列仅用于编辑器核对。原型默认带路径提示；Unity 截图为未选择状态，生产发牌由可解生成器决定。'],pause:['pause&mode=challenge&level=3','pause-388x784',388,784,'暂停入口已补齐重开确认。Unity 保留真实剩余时间，隐藏全部水果与路径，继续按钮恢复有效计时。'],help:['help&mode=challenge&level=3','help-388x784',388,784,'Unity 追加免费无解洗牌说明；游戏内按钮直接继续游戏。共享设置使用宿主真实设置弹层。']};
const select=document.getElementById('case'),frame=document.getElementById('prototype'),pic=document.getElementById('unity');
function show(){document.body.classList.remove('overview');document.getElementById('pause-panel').hidden=true;document.getElementById('unity-label').textContent='Unity 首版历史渲染';const c=cases[select.value];frame.src='index.html?embed=1&view='+c[0];pic.src='../../screenshots/link-match-'+c[1]+'.png';for(const el of [frame,pic]){el.style.width=c[2]+'px';el.style.height=c[3]+'px';el.style.transform='scale('+(272/c[2])+')'}document.getElementById('note').textContent=c[4]}
select.addEventListener('change',show);document.getElementById('overview').addEventListener('click',()=>{select.value='entry';show();document.body.classList.add('overview');document.getElementById('pause-panel').hidden=false;document.getElementById('unity-label').textContent='历史三关选关 · 388 × 784';document.getElementById('note').textContent='三个页面均来自当前生产代码的 Unity 首版历史渲染；浏览器仅负责展示原始输出。'});show();
</script></html>
