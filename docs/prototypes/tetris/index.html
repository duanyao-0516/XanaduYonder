<style>
@font-face{font-family:CollectionNoto;src:url('../../../Assets/Resources/Fonts/NotoSansCJKsc-Regular.otf') format('opentype');font-display:swap}
:root{font-family:CollectionNoto,'Noto Sans CJK SC','PingFang SC',sans-serif;font-synthesis:none;color:#173d35;background:#e9ece5}*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:2px solid #9e7842;outline-offset:2px}button[aria-disabled=true]{cursor:default}[hidden]{display:none!important}.study{max-width:800px;margin:auto;padding:24px}.study-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.study-header h1{font-size:20px;font-weight:500;margin:0}.study-header span{font-size:12px;color:#718179}.study-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.study-tools button{font-size:12px;border-radius:9px;background:#f6f4ec;padding:10px 14px;min-height:40px}.study-tools button[aria-pressed=true]{background:#276653;color:#f6f4ec}.surface{--safe-height:784px;width:388px;max-width:100%;height:var(--safe-height);background:#f6f4ec;margin:auto;position:relative;overflow:hidden;display:flex;flex-direction:column}.surface.short{--safe-height:688px}.nav{height:56px;flex:none;position:relative}.nav-button{position:absolute;top:6px;width:44px;height:44px;background:transparent;display:grid;place-items:center;padding:6px}.nav-button>span{display:grid;place-items:center;background:#e7ede4;border-radius:10px;width:32px;height:32px}.nav-button svg{width:20px;height:20px}.nav-button.home{left:13.5px}.nav-button.book{right:61.5px}.nav-button.settings{right:13.5px}.nav-brand{position:absolute;left:50%;top:18px;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#718179;letter-spacing:.2px}.game{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:12px}.heading{margin:0 19.5px;height:44px;display:flex;justify-content:space-between;align-items:center;flex:none}.heading h2{font-size:26.5px;font-weight:500;line-height:1.45;margin:0}.pause{background:#e7ede4;border-radius:10px;height:36px;padding:0 14px;font-size:12px}.counts{height:36px;flex:none;margin:0 19.5px 8px;border-bottom:1px solid #dce2d6;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#718179;white-space:nowrap}.counts b{font-weight:500;font-size:15px;color:#173d35;font-variant-numeric:tabular-nums;margin-left:4px}.arena{margin:0 19.5px;flex:1;min-height:0;position:relative;border-radius:15px;background:#ebeee2;padding:12px;display:flex;justify-content:center;align-items:center;gap:4px}.board{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(20,1fr);width:var(--board-width,235px);height:var(--board-height,470px);flex:none;overflow:hidden;border-radius:3px;background:#e0e6d9}.board i{display:block;background:#e2e7dc;box-shadow:inset 0 0 0 .45px #b6c2b257;position:relative}.board i[data-piece]{background:var(--piece);box-shadow:inset 0 0 0 1px #f6f4ec88,inset 0 -2px 0 #173d3510}.board .ghost{background:transparent;box-shadow:inset 0 0 0 1.5px #9f87b4}.side{width:40px;align-self:flex-start;flex:none;display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:2px;font-size:11px;color:#718179}.side strong{font-size:11px;font-weight:400;white-space:nowrap}.hold{width:40px;background:#dfe7d9;border-radius:8px;padding:8px 1px 12px;display:flex;flex-direction:column;align-items:center;gap:14px}.piece{display:grid;grid-template-columns:repeat(4,8px);grid-template-rows:repeat(2,8px);gap:1px;width:max-content}.piece i{display:block;border-radius:1px}.piece .filled{background:var(--piece)}.operations{margin:16px 19.5px 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:48px 48px;gap:8px;flex:none}.operations button{padding:0;background:#e7ede4;border-radius:12px;font-size:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px}.operations button .symbol{font-size:19px;line-height:1}.operations button.primary{grid-column:1/-1;background:#276653;color:#f6f4ec;flex-direction:row;gap:8px;font-size:14px}.lobby{padding:20px 30px 28px;flex:1}.lobby-brand{font-size:13px;font-weight:500;color:#276653;margin-bottom:28px}.lobby h2{font-size:25px;font-weight:500;margin:0 0 14px;white-space:nowrap;letter-spacing:-.6px}.lobby-intro{font-size:13px;color:#718179;margin:0 0 30px}.game-card{height:189px;margin-bottom:13px;position:relative;background:#e6eadb;border-radius:12px;padding:16px 18px}.game-card.tetris{background:#dfe8d9}.card-category{font-size:12px;color:#276653}.game-card h3{font-size:28px;font-weight:500;margin:12px 0 6px;line-height:1.3;letter-spacing:-.7px}.card-copy{font-size:14px;margin:0 0 7px}.card-record{font-size:12px;color:#718179}.card-start{position:absolute;bottom:12px;left:18px;right:18px;height:38px;background:#276653;color:#f6f4ec;border-radius:10px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:9px}.card-art{position:absolute;right:20px;top:38px;display:grid;grid-template-columns:repeat(3,15px);grid-template-rows:repeat(2,15px);gap:2px;transform:rotate(-8deg)}.card-art i{background:#93aa85;border-radius:3px}.card-art i:first-child,.card-art i:last-child{visibility:hidden}.overlay{position:absolute;inset:0;background:#173d355e;display:flex;align-items:center;justify-content:center;padding:26px;z-index:4}.dialog{background:#f6f4ec;border-radius:20px;padding:26px 22px;width:100%;max-width:308px}.dialog h3{font-size:23px;font-weight:500;margin:0 0 10px}.dialog p{font-size:13px;color:#718179;line-height:1.7;margin:0 0 22px}.dialog button{height:46px;width:100%;border-radius:10px;background:#e7ede4;margin-top:8px;font-size:14px}.dialog button.primary{background:#276653;color:#f6f4ec}.study-caption{font-size:12px;color:#718179;text-align:center;margin:16px 0 0}.capture .study{padding:0;max-width:none;margin:0}.capture .study-header,.capture .study-tools,.capture .study-caption{display:none}.capture .surface{margin:0}.capture{background:#f6f4ec}.capture .surface{max-width:none} @media(max-width:450px){.study{padding:16px 0}.study-header,.study-tools{margin-left:16px;margin-right:16px}.study-header{align-items:flex-start;flex-direction:column}.surface{width:min(388px,100%)}.lobby{padding-left:24px;padding-right:24px}.lobby h2{font-size:23px}}
.surface.lobby-view .nav-brand{left:30px;top:22px;transform:none;font-size:13px;color:#276653}.surface.lobby-view .nav-button.home,.surface.lobby-view .nav-button.book,.lobby-brand{display:none}.lobby .game-card:not(.tetris){background:#eae4d4}
</style>
</head>
<body>
<main class="study">
  <header class="study-header"><h1>俄罗斯方块 · UI 研究原型</h1><span>静态局面，不计时、不保存</span></header>
  <div class="study-tools" aria-label="研究视图"><button data-view="lobby" aria-pressed="false">大厅新卡</button><button data-view="game" aria-pressed="true">游戏页 · 388×784</button><button data-view="short" aria-pressed="false">短屏 · 388×688</button><button data-view="paused" aria-pressed="false">暂停 / 恢复</button></div>
  <section class="surface" aria-label="合集安全内容区域，不含系统栏">
    <nav class="nav" aria-label="合集导航"><button class="nav-button home" data-action="home" aria-label="返回大厅"><span data-icon="Home"></span></button><div class="nav-brand">XANADU / YONDER</div><button class="nav-button book" aria-label="玩法说明（原型仅展示入口）" aria-disabled="true"><span data-icon="Book"></span></button><button class="nav-button settings" aria-label="公共设置（原型仅展示入口）" aria-disabled="true"><span data-icon="Settings"></span></button></nav>
    <section class="game" aria-label="俄罗斯方块游戏页面">
      <header class="heading"><h2>俄罗斯方块</h2><button class="pause" data-action="pause">暂停</button></header>
      <div class="counts"><span>得分<b>1 240</b></span><span>等级<b>1</b></span><span>消行<b>8</b></span></div>
      <div class="arena"><aside class="side"><button class="hold" aria-disabled="true" aria-label="暂存方块，布局示意"><strong>暂存</strong><span class="piece" data-shape="O"></span></button></aside><div class="board" role="img" aria-label="十列二十行静态方格棋盘及当前方块落点影子"></div><aside class="side"><strong>接下来</strong><span class="piece" data-shape="I" aria-label="下一块 I"></span><span class="piece" data-shape="L" aria-label="下两块 L"></span><span class="piece" data-shape="Z" aria-label="下三块 Z"></span></aside></div>
      <div class="operations" aria-label="游戏操作，只展示布局"><button aria-disabled="true"><span class="symbol" aria-hidden="true">←</span>左移</button><button aria-disabled="true"><span class="symbol" aria-hidden="true">↓</span>软降</button><button aria-disabled="true"><span class="symbol" aria-hidden="true">→</span>右移</button><button aria-disabled="true"><span class="symbol" aria-hidden="true">↶</span>左转</button><button aria-disabled="true"><span class="symbol" aria-hidden="true">↷</span>右转</button><button class="primary" aria-disabled="true"><span class="symbol" aria-hidden="true">⇣</span>立即落下</button></div>
    </section>
    <section class="lobby" aria-label="大厅末尾新卡片示例" hidden><h2>小小一局，慢慢向前。</h2><p class="lobby-intro">把片刻空闲，留给一点简单的快乐。</p><article class="game-card"><div class="card-category">12 / 经典推箱</div><h3>推箱子</h3><p class="card-copy">把每一只箱子，推回它的位置。</p><div class="card-record">已完成 0 / 108 关</div><button class="card-start" aria-disabled="true">开始 / 继续游戏 →</button></article><article class="game-card tetris"><div class="card-category">13 / 方块消除</div><h3>俄罗斯方块</h3><div class="card-art" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><p class="card-copy">拼满一行，留一点从容。</p><div class="card-record">你的最高记录 0</div><button class="card-start" data-action="play">开始游戏 →</button></article></section>
    <div class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="pause-title"><h3 id="pause-title">已暂停</h3><p>准备好了，就从这里继续。</p><button class="primary" data-action="resume">继续游戏</button><button data-action="home">返回大厅</button></section></div>
  </section>
  <p class="study-caption">布局与状态示例，不代表 Unity 运行截图；大厅仅展示末尾卡片。</p>
</main>
<script>
(() => {
  const surface=document.querySelector('.surface'), game=document.querySelector('.game'), lobby=document.querySelector('.lobby'), overlay=document.querySelector('.overlay'), board=document.querySelector('.board'), arena=document.querySelector('.arena');
  const colors={I:'#70b7bb',O:'#d9ba64',T:'#aa91b6',J:'#7897be',L:'#d59d6d',S:'#8dac7a',Z:'#c9827f'},shapes={O:[1,2,5,6],I:[4,5,6,7],L:[2,4,5,6],Z:[0,1,5,6]};
  const cells=new Map();[[17,'JJJ.OO.SS.'],[18,'JLLLOOZZSS'],[19,'LLLIIIIZZ.']].forEach(([y,line])=>[...line].forEach((p,x)=>{if(p!=='.')cells.set(y*10+x,p);}));[33,34,35,44].forEach(i=>cells.set(i,'T'));const ghost=new Set([153,154,155,164]);
  for(let i=0;i<200;i++){const cell=document.createElement('i');cell.setAttribute('aria-hidden','true');if(cells.has(i)){cell.dataset.piece=cells.get(i);cell.style.setProperty('--piece',colors[cells.get(i)]);}if(ghost.has(i))cell.classList.add('ghost');board.appendChild(cell);}
  document.querySelectorAll('.piece').forEach(el=>{const shape=el.dataset.shape;el.style.setProperty('--piece',colors[shape]);for(let i=0;i<8;i++){const c=document.createElement('i');if(shapes[shape].includes(i))c.className='filled';el.appendChild(c);}});
  function fit(){if(game.hidden)return;const cell=Math.min((arena.clientWidth-24-88)/10,(arena.clientHeight-24)/20);board.style.setProperty('--board-width',`${cell*10}px`);board.style.setProperty('--board-height',`${cell*20}px`);}
  function setPaused(paused){overlay.hidden=!paused;game.inert=paused;document.querySelector('.nav').inert=paused;if(paused)overlay.querySelector('[data-action=resume]').focus();}
  function show(view){const isLobby=view==='lobby';game.hidden=isLobby;lobby.hidden=!isLobby;surface.classList.toggle('lobby-view',isLobby);surface.classList.toggle('short',view==='short');setPaused(view==='paused');document.querySelectorAll('[data-view]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.view===view)));fit();}
  document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>show(el.dataset.view)));
  document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{const action=el.dataset.action;if(action==='home')show('lobby');else if(action==='play')show('game');else if(action==='pause')setPaused(true);else if(action==='resume'){setPaused(false);document.querySelector('.pause').focus();}}));
  // Same normalized icon geometry as UiIconGraphic.cs, reused from the Sokoban prototype.
  const path=a=>`<polyline points="${a.map(p=>p.join(',')).join(' ')}"/>`;
  const icons={Home:path([[-.42,.01],[0,.4],[.42,.01]])+path([[-.3,.09],[-.3,-.36],[-.11,-.36],[-.11,-.1],[.11,-.1],[.11,-.36],[.3,-.36],[.3,.09]]),Book:path([[0,-.32],[-.18,-.24],[-.42,-.24],[-.42,.34],[-.18,.34],[0,.26],[.18,.34],[.42,.34],[.42,-.24],[.18,-.24],[0,-.32],[0,.26]])+[0,1].map(i=>path([[-.3,.16-i*.16],[-.13,.12-i*.16]])+path([[.13,.12-i*.16],[.3,.16-i*.16]])).join('')};
  const gear=Array.from({length:64},(_,i)=>{const a=i*Math.PI*2/64,r=i%8<2||i%8>5?.35:.47;return`${Math.cos(a)*r},${Math.sin(a)*r}`;}).join(' L');icons.Settings=`<path d="M${gear} Z M.17,0 A.17,.17 0 1,0 -.17,0 A.17,.17 0 1,0 .17,0 Z" fill="currentColor" fill-rule="evenodd" stroke="none"/>`;
  document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=`<svg viewBox="-.5 -.5 1 1" aria-hidden="true"><g transform="scale(1,-1)" fill="none" stroke="currentColor" stroke-width=".07" stroke-linecap="round" stroke-linejoin="round">${icons[el.dataset.icon]}</g></svg>`);
  const params=new URLSearchParams(location.search);if(params.get('capture')==='1')document.body.classList.add('capture');show(['lobby','short','paused'].includes(params.get('view'))?params.get('view'):'game');new ResizeObserver(fit).observe(arena);
})();
</script>
</body>
</html>
