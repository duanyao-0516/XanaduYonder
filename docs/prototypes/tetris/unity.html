<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄罗斯方块 · Unity UI 示例</title>
<style>
:root{color-scheme:light;--paper:#f6f4ec;--ink:#173d35;--accent:#276653}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,"PingFang SC",sans-serif}main{max-width:1080px;margin:auto;padding:34px 24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:26px;margin:0}p{color:#66796f;margin:8px 0 18px}a{color:var(--accent)}.tag{border:1px solid #d6dfd1;border-radius:99px;padding:4px 12px;font-size:12px;white-space:nowrap}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}button{font:inherit;border:1px solid #dbe2d6;color:var(--ink);background:#e7ede4;border-radius:10px;padding:9px 15px;cursor:pointer}button[aria-pressed="true"]{background:var(--accent);color:white;border-color:var(--accent)}button:focus-visible{outline:3px solid #d9ba64;outline-offset:3px}.screens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}figure{margin:0;display:flex;flex-direction:column;align-items:center}figcaption{align-self:flex-start;color:#66796f;font-size:13px;padding-bottom:10px}img{width:100%;max-width:388px;height:auto;display:block;border:1px solid #dae1d5;border-radius:14px;box-shadow:0 12px 30px #173d3509}.note{border-top:1px solid #dce2d6;margin-top:28px;padding-top:18px;font-size:13px}figure[hidden]{display:none}@media(max-width:680px){main{padding:24px 16px}.screens{grid-template-columns:1fr}header{display:block}.tag{display:inline-block;margin-top:10px}h1{font-size:22px}}
</style></head><body><main>
<header><h1>俄罗斯方块 · Unity UI 示例</h1><span class="tag">独立竖屏 · 合并前截图</span></header>
<p>纸色背景、深绿导航，完整棋盘与集中操作区。下方是生产 UGUI 的实际渲染图；展示局面用于验证，此页不运行游戏。图片保留合并前的第 14 张卡和原倒数字样；当前源码中俄罗斯方块为第 15 款，继续倒数显示“倒计时：3／2／1”。</p>
<div class="controls" aria-label="页面状态">
<button data-state="game" aria-pressed="true">游戏中</button><button data-state="lobby-card" aria-pressed="false">大厅新卡</button><button data-state="ready" aria-pressed="false">准备开始</button><button data-state="paused" aria-pressed="false">暂停</button><button data-state="countdown" aria-pressed="false">继续倒数</button><button data-state="hold-used" aria-pressed="false">暂存已用</button><button data-state="clear-feedback" aria-pressed="false">消行反馈</button><button data-state="game-over" aria-pressed="false">本局结束</button><button data-state="max-score" aria-pressed="false">长数字</button><button data-state="warning" aria-pressed="false">保存提示</button><button data-state="corrupt-save" aria-pressed="false">损坏存档</button><button data-state="future-save" aria-pressed="false">版本保护</button>
</div>
<div class="screens"><figure><figcaption>常规安全内容 · 388 × 784</figcaption><img id="normal" width="388" height="784" src="unity-screenshots/game-388x784.png" alt="常规屏俄罗斯方块游戏页面"></figure><figure id="short-figure"><figcaption>短屏安全内容 · 388 × 688</figcaption><img id="short" width="388" height="688" src="unity-screenshots/game-388x688.png" alt="短屏俄罗斯方块游戏页面"></figure></div>
<p class="note">安全区由 APP 宿主处理，图中不再叠加系统栏。棋盘分别为 237 × 474 和 194 × 388，始终保留 10 × 20 个正方格。截图及射线检查不代表真机触摸、声音与帧率验收。<br><a href="../../verification-tetris.md">验证记录</a> · <a href="README.md">尺寸与来源</a> · <a href="index.html">原始研究原型</a></p>
</main><script>
const buttons=[...document.querySelectorAll('[data-state]')];for(const button of buttons)button.addEventListener('click',()=>{const state=button.dataset.state;for(const other of buttons)other.setAttribute('aria-pressed',String(other===button));document.getElementById('normal').src=`unity-screenshots/${state}-388x784.png`;document.getElementById('normal').alt=`常规屏：${button.textContent}`;document.getElementById('short-figure').hidden=state==='lobby-card';if(state!=='lobby-card'){document.getElementById('short').src=`unity-screenshots/${state}-388x688.png`;document.getElementById('short').alt=`短屏：${button.textContent}`;}});
</script></body></html>
