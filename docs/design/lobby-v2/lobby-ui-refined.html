<style>
#lobby-ui-refined .xy-stage { display:flex; justify-content:center; align-items:flex-start; padding:20px 8px; box-sizing:border-box; min-height:1180px; }

#lobby-ui-refined .xy-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }

#lobby-ui-refined .xy-title { font-size:23px; line-height:1.4; margin:20px 0 5px; font-weight:650; letter-spacing:-.4px; }
#lobby-ui-refined .xy-subtitle { color:var(--muted); font-size:12px; margin:0; line-height:1.6; }

#lobby-ui-refined .xy-count { font-size:12px; color:var(--muted); }
#lobby-ui-refined .xy-display { display:flex; align-items:center; gap:6px; border:0; min-height:36px; padding:0 9px; border-radius:9px; background:#E7EDE4; color:var(--accent); font-size:12px!important; }

#lobby-ui-refined [data-layout="single"] .xy-game-head { padding-right:77px; }

#lobby-ui-refined .xy-fallback-label { color:var(--muted); font-size:11px; margin-top:6px; }

<script>
(() => {
 const root=document.getElementById('lobby-ui-refined');
 const logos=JSON.parse(document.getElementById('xy-logo-data').textContent);
 const icons=JSON.parse(document.getElementById('xy-icon-data').textContent);
 const groups=[
  {name:'逻辑策略',tone:'sage',items:[['sudoku','数独','grid-3x3','已完成 12 关','九宫之间，找到唯一。'],['minesweeper','扫雷','flag','最佳 62 秒','数字之间，步步为营。'],['sliding-puzzle','数字华容道','move','最佳 42 步','留一格空白，理顺每一步。'],['sokoban','推箱子','package','已完成 8 关','把每一只箱子，推回它的位置。'],['gomoku','五子棋','circle-dot','人机 / 双人','一子一步，先连成五。']]},
  {name:'合成消除',tone:'warm',items:[['2048','2048','grid-2x2','最高 4096 分','让相同的数字相遇。'],['watermelon','合成大西瓜','circle','三种主题','小小一颗，合成满满的快乐。'],['sheep','旸了个旸','layers','已通关 3 次','翻开一层，凑齐三个。'],['link-match','连连看','link','轻松 / 挑战','找到相同，连起快乐。'],['zuma','Zuma','target','18 张地图','转动青蛙，让同色弹珠相遇。'],['tetris','俄罗斯方块','blocks','最高 2400 分','落下一块，留一点从容。']]},
  {name:'敏捷挑战',tone:'soft',items:[['jump','跳一跳','footprints','最高 28 分','按住，松手，再远一点。'],['dino','Dino','footprints','最高 368 分','横屏或竖屏，跑得更远一点。'],['flappy-bird','Flappy Bird','bird','最高 12 分','轻点一下，再飞远一点。'],['happy-ball','欢乐球球','circle-arrow-down','最高 360 分','转动高塔，穿过层层豁口。'],['gold-miner','黄金矿工','pickaxe','单人 / 双人','看准时机，把宝藏带回家。']]},
  {name:'文字语言',tone:'sage',items:[['idiom','成语接龙',null,'同字 / 同音','一来一往，认识更多好词。']]}
 ];
 const captions={watermelon:['04','碰碰合成'],zuma:['08','神庙弹珠'],'happy-ball':['11','轻巧下落'],idiom:['05','一词一世界']};
 const titles={double:'双列卡片',directory:'分类目录',single:'单列大卡'};
 const notes={double:'图标与名称同行 · 一行纪录',directory:'图标与名称 · 紧凑排列',single:'大 Logo · 玩法介绍与纪录'};
 const makeIcon=(name,size=20)=>'<img src="'+(icons[name]||icons.gamepad)+'" width="'+size+'" height="'+size+'" alt="" aria-hidden="true">';
 root.querySelectorAll('.xy-app').forEach(app=>{
  const initial=app.dataset.layout; let mode=initial;
  const options={records:true,spacing:10};
  const header=document.createElement('header');
  header.innerHTML='<div class="xy-top"><span class="xy-brand">XANADU / YONDER</span><button type="button" class="xy-icon-button cursor-interaction" aria-label="大厅设置示意">'+makeIcon('settings')+'</button></div><h2 class="xy-title">小小一局，慢慢向前。</h2><p class="xy-subtitle">把片刻空闲，留给一点简单的快乐。</p>';
  app.append(header);
  const toolbar=document.createElement('div');toolbar.className='xy-tools';toolbar.innerHTML='<span class="xy-count">全部游戏 · 17 款</span><button type="button" class="xy-display cursor-interaction">'+makeIcon('sliders-horizontal',16)+'<span>展示</span></button>';app.append(toolbar);
  const body=document.createElement('div');app.append(body);
  const foot=document.createElement('p');foot.className='xy-footer';app.append(foot);
  const feedback=document.createElement('div');feedback.className='xy-feedback';feedback.setAttribute('aria-live','polite');app.append(feedback);
  const overlay=document.createElement('div');overlay.className='xy-sheet-backdrop';overlay.hidden=true;overlay.innerHTML='<section class="xy-sheet" role="dialog" aria-modal="true" aria-label="选择大厅展示方式"><div class="xy-sheet-title">展示方式<button type="button" class="xy-icon-button xy-close cursor-interaction" aria-label="关闭展示设置">'+makeIcon('x')+'</button></div><div class="xy-options"></div><button type="button" class="xy-done cursor-interaction">完成</button></section>';app.append(overlay);
  let trigger=null;
  function closeSheet(){overlay.hidden=true;if(trigger)trigger.focus();}
  function openSheet(){trigger=app.contains(document.activeElement)?document.activeElement:null;const list=overlay.querySelector('.xy-options');list.replaceChildren();Object.keys(titles).forEach(key=>{const option=document.createElement('button');option.type='button';option.className='xy-sheet-option cursor-interaction';option.setAttribute('aria-pressed',String(mode===key));option.innerHTML='<span>'+titles[key]+'<small>'+notes[key]+'</small></span>'+(mode===key?makeIcon('check'):'' );option.onclick=()=>{mode=key;app.dataset.layout=key;render();closeSheet();};list.append(option);});overlay.hidden=false;overlay.querySelector('.xy-close').focus();}
  overlay.querySelector('.xy-close').onclick=closeSheet;overlay.querySelector('.xy-done').onclick=closeSheet;overlay.onclick=e=>{if(e.target===overlay)closeSheet();};overlay.onkeydown=e=>{if(e.key==='Escape')closeSheet();};
  toolbar.querySelector('button').onclick=openSheet;header.querySelector('button').onclick=()=>{feedback.textContent='大厅设置入口示意';};
  function buildCard(game,group){
   const [id,name,icon,record,description]=game;const button=document.createElement('button');button.type='button';button.className='xy-game cursor-interaction';button.dataset.tone=group.tone;button.setAttribute('aria-label','选择'+name+'，界面预览');
   if(mode==='single'){const kind=document.createElement('span');kind.className='xy-kind';kind.textContent=captions[id][0]+' / '+group.name+' / '+captions[id][1];button.append(kind);}
   const head=document.createElement('span');head.className='xy-game-head';
   if(mode!=='single'){const symbol=document.createElement('span');symbol.className='xy-small-icon';symbol.innerHTML=makeIcon(icon,22);head.append(symbol);}
   const title=document.createElement('span');title.className='xy-name';title.textContent=name;head.append(title);button.append(head);
   if(mode==='single'){if(logos[id]){const logo=document.createElement('img');logo.className='xy-logo';logo.src=logos[id];logo.alt='';button.append(logo);}else button.classList.add('no-logo');const desc=document.createElement('span');desc.className='xy-description';desc.textContent=description;button.append(desc);}
   if(mode!=='directory'&&options.records){const line=document.createElement('span');line.className='xy-record';line.textContent=record;button.append(line);}
   button.onclick=()=>feedback.textContent='已选择「'+name+'」 · 入口示意';return button;
  }
  function render(){
   app.style.setProperty('--gap',options.spacing+'px');body.replaceChildren();
   toolbar.querySelector('.xy-display span').textContent=mode==='assets'?'图标规范':titles[mode];
   if(mode==='assets'){
    toolbar.hidden=true;header.querySelector('.xy-title').textContent='同一套图标，同一种气质。';header.querySelector('.xy-subtitle').textContent='奶油底 · 墨绿线稿 · 圆头与圆角';
    const swatches=document.createElement('div');swatches.className='xy-swatches';[['奶油底','#F6F4EC'],['墨绿文字','#173D35'],['强调绿','#276653']].forEach(([label,color])=>{const swatch=document.createElement('div');swatch.className='xy-swatch';const sample=document.createElement('span');sample.className='xy-swatch-sample';sample.style.background=color;swatch.append(sample,document.createTextNode(label));swatches.append(swatch);});body.append(swatches);
    const fallback=document.createElement('div');fallback.className='xy-fallback';fallback.innerHTML=makeIcon('gamepad',48)+'<div><div class="xy-fallback-name">成语接龙</div><div class="xy-fallback-label">缺少小图标时，统一使用手柄</div></div>';body.append(fallback);
    const catalog=document.createElement('div');catalog.className='xy-icon-catalog';groups.flatMap(g=>g.items).forEach(game=>{const tile=document.createElement('div');tile.className='xy-icon-sample';tile.innerHTML=makeIcon(game[2],25);const label=document.createElement('span');label.textContent=game[1];tile.append(label);catalog.append(tile);});body.append(catalog);
    foot.textContent='24 × 24 矢量母版 · 统一线宽与视觉边距';return;
   }
   toolbar.hidden=false;
   if(mode==='single'){
    const grid=document.createElement('div');grid.className='xy-grid';const selected=['watermelon','zuma','happy-ball','idiom'];selected.forEach(id=>{const group=groups.find(g=>g.items.some(item=>item[0]===id));grid.append(buildCard(group.items.find(item=>item[0]===id),group));});body.append(grid);
    foot.textContent='单列节选 · 使用现有大 Logo · 纪录为示意';
   }else{
    groups.forEach(group=>{const section=document.createElement('section');section.className='xy-group';const heading=document.createElement('h3');heading.className='xy-group-title';heading.append(document.createTextNode(group.name));const count=document.createElement('span');count.textContent=group.items.length+' 款';heading.append(count);section.append(heading);const grid=document.createElement('div');grid.className='xy-grid';const items=mode==='double'?group.items.filter(item=>['sudoku','minesweeper','watermelon','zuma','jump','happy-ball','idiom'].includes(item[0])):group.items;items.forEach(game=>grid.append(buildCard(game,group)));section.append(grid);body.append(section);});
    foot.textContent=mode==='double'?'双列节选 · 图标与名称同行 · 纪录为示意':'全部 17 款 · 无需联网 · 无广告';
   }
   
  }
  render();
  if(globalThis.Tweak&&mode!=='assets'){const tweak=new Tweak({container:app,onChange:render});if(mode!=='directory')tweak.addToggle(options,'records',{label:'展示一行纪录'});tweak.addSlider(options,'spacing',{label:'卡片间距',min:8,max:16,step:2,unit:'px'});}
 });
})();
</script>
