<script>
(() => {
  const root=document.getElementById('snake-ui-v2');
  const levels=JSON.parse(document.getElementById('snake-preview-levels').textContent);
  const exampleSnake=[[12,14],[11,14],[10,14],[9,14],[8,14],[7,14],[6,14],[6,15],[6,16],[6,17],[6,18],[7,18],[8,18],[9,18],[10,18],[11,18],[12,18],[12,19]];
  const initialSnake=[[6,20],[5,20],[4,20],[3,20]];
  const states={
    classic:{boundary:'wrap',scene:'playing',difficulty:'standard',fresh:false,sound:true,haptics:true},
    challenge:{level:'snake-08',scene:'playing',sound:true,haptics:true},
    fullboard:{boundary:'wrap',scene:'won',difficulty:'standard',fresh:false,sound:true,haptics:true}
  };
  const panels=new Map();
  const icon=(name,extra='')=>'<i data-lucide="'+name+'" class="'+extra+'" aria-hidden="true"></i>';
  function restore(saved){
    if(saved?.revision!==2)return;
    for(const key of Object.keys(states)){
      const src=saved[key],dst=states[key];if(!src)continue;
      if(['playing','paused','won'].includes(src.scene))dst.scene=src.scene;
      if(['wrap','solid'].includes(src.boundary)&&key!=='challenge')dst.boundary=src.boundary;
      if(['easy','standard','hard'].includes(src.difficulty)&&key!=='challenge')dst.difficulty=src.difficulty;
      if(key==='challenge'&&levels.some(l=>l.id===src.level))dst.level=src.level;
      for(const field of ['fresh','sound','haptics'])if(typeof src[field]==='boolean')dst[field]=src[field];
    }
  }
  restore(window.openai?.widgetState?.modelContent);
  function save(){window.openai?.setWidgetState?.({modelContent:{revision:2,...states},privateContent:null}).catch(()=>{});}
  function pauseForModal(state){if(state.scene==='playing')state.scene='paused';save();}
  function refreshIcons(){globalThis.lucide?.createIcons();}
  function renderDialog(phone,title,body,actions){
    phone.querySelector('.s-overlay').hidden=false;
    phone.querySelector('.s-dialog').innerHTML='<h3>'+title+'</h3>'+body+actions;
    refreshIcons();
  }
  const button=(action,label,primary=false)=>'<button class="cursor-interaction '+(primary?'s-primary':'')+'" data-action="'+action+'">'+label+'</button>';
  function render(phone){
    const key=phone.dataset.preview,state=states[key],challenge=key==='challenge';
    const level=challenge?levels.find(l=>l.id===state.level):null;
    const boundary=challenge?level.boundary:state.boundary;
    const obstacles=challenge?level.obstacles:[];
    const walls=new Set(obstacles.map(p=>p.join(',')));
    const capacity=480-walls.size,won=state.scene==='won',full=won&&!challenge;
    let snake=challenge||state.fresh?initialSnake:exampleSnake;
    if(won&&challenge){
      const path=[];for(let x=6;x>=0;x--)path.push([x,20]);for(let x=0;x<20;x++)path.push([x,21]);for(let x=19;x>=0;x--)path.push([x,22]);
      snake=path.slice(0,level.targetFood+4);
    }
    const body=new Set(snake.map(p=>p.join(',')));
    let food=[14,10];
    if(walls.has(food.join(','))||body.has(food.join(','))){
      for(let i=0;i<480;i++){const p=[i%20,Math.floor(i/20)];if(!walls.has(p.join(','))&&!body.has(p.join(','))){food=p;break;}}
    }
    const length=full?480:snake.length,foodCount=full?476:length-4,score=foodCount*10;
    phone.querySelector('.s-mode').innerHTML=(challenge?'障碍闯关':'经典无限');
    phone.querySelector('.s-stats').innerHTML='<span>得分<strong>'+score.toLocaleString('en-US')+'</strong></span>'+(challenge?'<span>果实<strong>'+foodCount+'/'+level.targetFood+'</strong></span>':'<span>蛇长<strong>'+length+'</strong></span>');
    const selector=phone.querySelector('.s-selector');
    selector.value=challenge?state.level:state.difficulty;
    const border=phone.querySelector('[data-action="boundary"]');
    border.disabled=challenge;
    border.setAttribute('aria-pressed',String(boundary==='wrap'));
    border.setAttribute('aria-label',challenge?'四边相通：'+(boundary==='wrap'?'开启':'关闭')+'，由本关固定':'四边相通：'+(boundary==='wrap'?'开启':'关闭'));
    border.innerHTML='<span class="s-boundary-label">'+icon('move-horizontal')+'<span>四边相通</span></span>'+(challenge?icon('lock-keyhole','s-lock'):'')+'<span class="s-switch" aria-hidden="true"></span>';
    const board=phone.querySelector('.s-board');board.classList.toggle('solid',boundary==='solid');
    board.setAttribute('aria-label','20列24行，'+(boundary==='wrap'?'四边相通':'围墙边界')+'，'+walls.size+'个障碍格，蛇长'+length+'，'+(challenge?'果实目标'+level.targetFood:'无食物目标'));
    let cells='';
    for(let y=0;y<24;y++)for(let x=0;x<20;x++){
      const cell=x+','+y;let type=(x+y)%2?'alt ':'';
      if(walls.has(cell))type+='wall';else if(full||body.has(cell))type+='snake';
      if(!full&&x===snake[0][0]&&y===snake[0][1])type+=' head';
      if(!won&&x===food[0]&&y===food[1])type+=' food';
      cells+='<span class="s-cell '+type+'" aria-hidden="true"></span>';
    }
    board.innerHTML=cells;
    phone.querySelectorAll('.s-exit').forEach(e=>e.hidden=boundary!=='wrap');
    phone.querySelector('.s-overlay').hidden=state.scene==='playing';
    if(state.scene==='paused')renderDialog(phone,'已暂停','<p>'+ (challenge?level.name:(boundary==='wrap'?'四边相通':'围墙边界'))+'</p><div class="s-number">'+score+'</div><p>本局得分</p>',button('resume','继续游戏',true)+button('restart','重新开始'));
    if(full)renderDialog(phone,'满盘通关','<div class="s-number">100%</div><p>480 / 480 可行走格</p><div class="s-results"><div><strong>4,760</strong>得分</div><div><strong>476</strong>果实</div></div>',button('restart','再来一局',true)+button('home','返回大厅'));
    if(won&&challenge){const last=level.id===levels[levels.length-1].id;renderDialog(phone,last?'本章已完成':'关卡通关','<p>'+level.name+'</p><div class="s-number">'+level.targetFood+' / '+level.targetFood+'</div><p>果实目标达成</p>',button(last?'restart':'next',last?'重玩关卡':'下一关',true)+button('home','返回大厅'));}
    refreshIcons();
  }
  root.querySelectorAll('.snake-phone').forEach(phone=>{
    const key=phone.dataset.preview,state=states[key],challenge=key==='challenge';panels.set(key,phone);
    const options=challenge?levels.map((l,i)=>'<option value="'+l.id+'">'+String(i+1).padStart(2,'0')+' '+l.name+'</option>').join(''):'<option value="easy">轻松</option><option value="standard">标准</option><option value="hard">挑战</option>';
    phone.innerHTML='<div class="s-status"><span>9:41</span><span class="s-status-icons">'+icon('signal')+icon('wifi')+icon('battery-full')+'</span></div>'+
      '<div class="s-nav"><button class="cursor-interaction" data-action="home" aria-label="返回大厅">'+icon('house')+'</button><span class="s-brand">XANADU / YONDER</span><button class="cursor-interaction" data-action="help" aria-label="玩法说明">'+icon('book-open')+'</button><button class="cursor-interaction" data-action="settings" aria-label="设置">'+icon('settings')+'</button></div>'+
      '<div class="s-heading"><h2 class="s-title">贪吃蛇</h2><span class="s-mode"></span></div>'+
      '<div class="s-info"><label class="s-select-wrap"><select class="s-selector cursor-interaction" aria-label="'+(challenge?'关卡预览':'难度预览')+'">'+options+'</select>'+icon('chevron-down')+'</label><div class="s-stats" aria-live="polite"></div></div>'+
      '<div class="s-board-wrap"><div class="s-board" role="img"></div><span class="s-exit left" aria-hidden="true">'+icon('move-horizontal')+'</span><span class="s-exit right" aria-hidden="true">'+icon('move-horizontal')+'</span><span class="s-exit top" aria-hidden="true">'+icon('move-vertical')+'</span><span class="s-exit bottom" aria-hidden="true">'+icon('move-vertical')+'</span></div>'+
      '<div class="s-controls"><div class="s-tools"><div class="s-tools-row"><button class="cursor-interaction" data-action="pause">'+icon('pause')+'暂停</button><button class="cursor-interaction" data-action="restart">'+icon('rotate-ccw')+'重来</button></div><button class="s-boundary cursor-interaction" data-action="boundary"></button></div><div class="s-pad" role="img" aria-label="右侧十字方向控制区示意"><span class="s-pad-key up">'+icon('chevron-up')+'</span><span class="s-pad-key left">'+icon('chevron-left')+'</span><span class="center"></span><span class="s-pad-key right">'+icon('chevron-right')+'</span><span class="s-pad-key down">'+icon('chevron-down')+'</span></div></div>'+
      '<div class="s-home-indicator" aria-hidden="true"></div><div class="s-overlay" hidden><div class="s-dialog" role="dialog" aria-modal="true" aria-label="游戏弹窗"></div></div>';
    phone.querySelector('.s-selector').addEventListener('change',event=>{
      state.pendingSelection=event.target.value;
      const previous=challenge?state.level:state.difficulty;event.target.value=previous;
      pauseForModal(state);
      renderDialog(phone,challenge?'进入所选关卡？':'更换难度？','<p>将结束当前对局并重新开始。</p>',button('confirm-selection','重新开始',true)+button('cancel','取消'));
    });
    phone.addEventListener('click',event=>{
      const target=event.target.closest('[data-action]');if(!target)return;
      const action=target.dataset.action;
      if(['boundary','restart','help','home','settings'].includes(action))pauseForModal(state);
      if(action==='boundary'&&!challenge){renderDialog(phone,state.boundary==='wrap'?'关闭四边相通？':'开启四边相通？','<p>切换边界后将重新开始。</p>',button('confirm-boundary','切换并重开',true)+button('cancel','取消'));return;}
      if(action==='confirm-boundary'){state.boundary=state.boundary==='wrap'?'solid':'wrap';state.fresh=true;state.scene='playing';}
      if(action==='confirm-selection'){if(challenge)state.level=state.pendingSelection;else state.difficulty=state.pendingSelection;delete state.pendingSelection;state.fresh=true;state.scene='playing';}
      if(action==='pause')state.scene='paused';
      if(action==='resume')state.scene='playing';
      if(action==='cancel'){delete state.pendingSelection;render(phone);save();return;}
      if(action==='restart'){renderDialog(phone,'重新开始？','<p>当前对局将结束。</p>',button('confirm-restart','重新开始',true)+button('cancel','取消'));return;}
      if(action==='confirm-restart'){state.fresh=true;state.scene='playing';}
      if(action==='next'){const index=levels.findIndex(l=>l.id===state.level);if(index<levels.length-1)state.level=levels[index+1].id;state.scene='playing';}
      if(action==='help'){renderDialog(phone,'玩法说明','<p>收集果实，避开蛇身与障碍。</p><p>四边相通时，穿过边缘会从对侧出现。占满可行走格子即可满盘通关。</p>',button('cancel','知道了',true));return;}
      if(action==='home'){renderDialog(phone,'返回大厅','<p>对局暂停后可从大厅继续。</p>',button('cancel','留在游戏',true));return;}
      if(action==='settings'){renderDialog(phone,'设置','<label class="s-setting">声音<input type="checkbox" data-setting="sound" '+(state.sound?'checked':'')+'></label><label class="s-setting">触感<input type="checkbox" data-setting="haptics" '+(state.haptics?'checked':'')+'></label>',button('cancel','完成',true));return;}
      render(phone);save();
    });
    phone.addEventListener('change',event=>{const field=event.target.dataset.setting;if(field){state[field]=event.target.checked;save();}});
    render(phone);
    if(globalThis.Tweak){
      const tweak=new Tweak({container:phone,onChange:()=>{render(phone);save();}});
      tweak.addSelect(state,'scene',{label:'界面状态',options:[{label:'进行中',value:'playing'},{label:'暂停',value:'paused'},{label:challenge?'目标通关':'满盘通关',value:'won'}]});
    }
  });
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.modelContent;if(saved?.revision===2){restore(saved);panels.forEach(render);}});
})();
</script>
