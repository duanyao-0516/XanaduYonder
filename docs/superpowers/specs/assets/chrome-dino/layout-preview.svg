<text x="52" y="991" font-size="18" font-weight="600" fill="#173D35">先把操作做简单</text>
<text x="52" y="1028" font-size="16" fill="#69736D">按下就跳，松开控制短跳。</text>
<text x="52" y="1059" font-size="16" fill="#69736D">下蹲独立按钮，不依赖隐蔽手势。</text>
