<text x="460" y="1028" font-size="16" fill="#69736D">仙人掌 → 组合障碍 → 翼龙。</text>
<text x="460" y="1059" font-size="16" fill="#69736D">昼夜只改变视觉，保持判定一致。</text>
<text x="868" y="991" font-size="18" font-weight="600" fill="#173D35">随时停，再来一局</text>
<text x="868" y="1028" font-size="16" fill="#69736D">返回前台先暂停，倒数后继续。</text>
<text x="868" y="1059" font-size="16" fill="#69736D">结束后保留纪录，一键再挑战。</text>
