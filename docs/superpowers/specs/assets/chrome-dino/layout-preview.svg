<rect x="134" y="470" width="202" height="94" fill="#173D35" rx="15"/>
<text x="73" y="510" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="22" fill="#173D35" font-weight="600" text-anchor="middle">下蹲</text>
<text x="73" y="538" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="13" fill="#69736D" font-weight="400" text-anchor="middle">按住</text>
<text x="235" y="510" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="23" fill="#F6F4EC" font-weight="600" text-anchor="middle">跳跃</text>
<text x="235" y="538" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="12" fill="#DDE7DF" font-weight="400" text-anchor="middle">轻按短跳 · 按住长跳</text>
<text x="70" y="607" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="14" fill="#173D35" font-weight="400" text-anchor="middle">玩法说明</text>
<text x="290" y="607" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="14" fill="#173D35" font-weight="400" text-anchor="middle">暂停</text>
</g>
<text x="824" y="238" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="23" fill="#173D35" font-weight="600" text-anchor="start">先选方向，局中锁定</text>
<text x="824" y="279" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" fill="#69736D" font-weight="400" text-anchor="start">每次进入先选横屏或竖屏。</text>
<text x="824" y="310" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" fill="#69736D" font-weight="400" text-anchor="start">再来一局沿用当前方向。</text>
<text x="824" y="341" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" fill="#69736D" font-weight="400" text-anchor="start">准备或结算时可更换方向。</text>
<text x="824" y="372" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" fill="#69736D" font-weight="400" text-anchor="start">返回大厅恢复竖屏。</text>
<rect x="824" y="407" width="404" height="1" fill="#D6DACF" rx="0"/>
<text x="824" y="450" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="23" fill="#173D35" font-weight="600" text-anchor="start">反应时间有下限</text>
<text x="824" y="491" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" fill="#69736D" font-weight="400" text-anchor="start">看清障碍 → 最晚安全操作</text>
<text x="824" y="528" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" fill="#69736D" font-weight="400" text-anchor="start">初始目标至少 1.2 秒。</text>
<text x="824" y="565" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" fill="#69736D" font-weight="400" text-anchor="start">已扣除起跳提前量和延迟预算。</text>
<text x="824" y="602" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" fill="#69736D" font-weight="400" text-anchor="start">到上限后，以组合增加挑战。</text>
<text x="824" y="682" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="21" fill="#276653" font-weight="600" text-anchor="start">横屏最高 / 竖屏最高</text>
<text x="824" y="718" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" fill="#69736D" font-weight="400" text-anchor="start">视野不同，纪录分别保存。</text>
<text x="824" y="759" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="14" fill="#69736D" font-weight="400" text-anchor="start">示意图不是运行截图。</text>
<text x="52" y="850" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#173D35" font-weight="600" text-anchor="start">03  横屏 · 展开更多前方视野</text>
