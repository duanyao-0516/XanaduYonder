<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="1280" viewBox="0 0 1280 1280">
<title>小恐龙开局选择、全宽竖屏与横屏布局</title>
<desc>每次从大厅进入先选方向，记住上次选择。两种方向跑道铺满安全区，横屏展现更多路程，分别记录最高分。设计示意，非运行截图。Chromium 像素素材许可见 LICENSE.chromium。</desc>
<defs><image id="atlas" width="1233" height="100" xlink:href="data:image/png;base64,"/></defs>
<rect x="0" y="0" width="1280" height="1280" fill="#EEECE4" rx="0"/>
<text x="52" y="50" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" fill="#276653" font-weight="600" text-anchor="start">XANADU / YONDER</text>
<text x="1228" y="50" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="15" fill="#69736D" font-weight="400" text-anchor="end">设计修订 · 2026.10.27</text>
<text x="52" y="101" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="36" fill="#173D35" font-weight="600" text-anchor="start">小恐龙 · 先选横屏或竖屏</text>
<text x="52" y="137" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="18" fill="#69736D" font-weight="400" text-anchor="start">跑道铺满安全区，宽视野留给玩家；反应窗口约束加速。</text>
<text x="52" y="190" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#173D35" font-weight="600" text-anchor="start">01  开局前选择</text>
<text x="444" y="190" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="19" fill="#173D35" font-weight="600" text-anchor="start">02  竖屏 · 全宽跑道</text>
<g transform="translate(52,210) scale(0.9)">
<rect x="0" y="0" width="360" height="660" fill="#F6F4EC" rx="24" stroke="#D6DACF" stroke-width="1.5"/>
<text x="28" y="43" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="14" fill="#173D35" font-weight="400" text-anchor="start">返回</text>
<text x="180" y="43" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" fill="#173D35" font-weight="600" text-anchor="middle">小恐龙</text>
<text x="28" y="111" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" fill="#173D35" font-weight="600" text-anchor="start">选择游玩方向</text>
<text x="28" y="142" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="14" fill="#69736D" font-weight="400" text-anchor="start">选好方向，再开始奔跑</text>
<rect x="24" y="176" width="312" height="122" fill="#E7ECE0" rx="14" stroke="#276653" stroke-width="1.5"/>
<rect x="43" y="200" width="34" height="57" fill="none" rx="5" stroke="#276653" stroke-width="1.5"/>
<text x="98" y="211" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="21" fill="#173D35" font-weight="600" text-anchor="start">竖屏</text>
<text x="98" y="239" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="12" fill="#69736D" font-weight="400" text-anchor="start">竖握即玩，跑道铺满屏宽</text>
<text x="98" y="270" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="14" fill="#173D35" font-weight="400" text-anchor="start">最高纪录  428</text>
<text x="314" y="203" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="12" fill="#276653" font-weight="600" text-anchor="end">已选</text>
<rect x="24" y="316" width="312" height="122" fill="#F6F4EC" rx="14" stroke="#D6DACF" stroke-width="1.5"/>
<rect x="40" y="347" width="50" height="29" fill="none" rx="4" stroke="#69736D" stroke-width="1.5"/>
<text x="106" y="351" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="21" fill="#173D35" font-weight="600" text-anchor="start">横屏</text>
<text x="106" y="379" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="12" fill="#69736D" font-weight="400" text-anchor="start">视野更宽，适合双手操作</text>
<text x="106" y="410" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="14" fill="#173D35" font-weight="400" text-anchor="start">最高纪录  860</text>
<rect x="24" y="482" width="312" height="66" fill="#173D35" rx="15"/>
<text x="180" y="523" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="21" fill="#F6F4EC" font-weight="600" text-anchor="middle">竖屏开始</text>
<text x="180" y="590" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="12" fill="#69736D" font-weight="400" text-anchor="middle">记住上次选择，每次进入仍可更换</text>
<text x="180" y="624" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="12" fill="#69736D" font-weight="400" text-anchor="middle">两种方向分别记录最高分</text>
</g>
